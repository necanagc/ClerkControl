name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Сборка и тесты
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskbot
          POSTGRES_PASSWORD: taskbot
          POSTGRES_DB: taskbot_test
        ports:
          - 5432:5432
        # Без healthcheck шаги могут начаться раньше, чем база начнёт принимать соединения.
        options: >-
          --health-cmd "pg_isready -U taskbot -d taskbot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://taskbot:taskbot@127.0.0.1:5432/taskbot_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Форматирование
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Не отформатировано:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Тесты (юнит + интеграционные)
        run: go test -race -count=1 ./...

      - name: Сборка
        run: go build ./...

      - name: Сборка Docker-образа
        run: docker build -f deploy/Dockerfile -t taskbot:ci .
