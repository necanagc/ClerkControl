services:
  postgres:
    image: postgres:16-alpine
    container_name: taskbot-postgres
    environment:
      POSTGRES_USER: taskbot
      POSTGRES_PASSWORD: taskbot
      POSTGRES_DB: taskbot
    ports:
      # только локальный интерфейс: наружу база не торчит
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskbot -d taskbot"]
      interval: 3s
      timeout: 3s
      retries: 10

  bot:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: taskbot:local
    container_name: taskbot
    profiles: ["full"]
    env_file: .env
    environment:
      # внутри compose-сети база доступна по имени сервиса, а не по localhost
      DATABASE_URL: postgres://taskbot:taskbot@postgres:5432/taskbot?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
